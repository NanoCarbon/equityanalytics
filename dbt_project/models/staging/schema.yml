version: 2

models:

  # ── Ticker reference ──────────────────────────────────────────────────────────

  - name: stg_ticker_universe
    description: >
      Canonical ticker list. Grain: ticker.
      Sources: sp500/sp400/sp600 (S&P Wikipedia), etf (hardcoded list),
      nasdaq_trader (NASDAQ Trader flat file — all US exchange-listed),
      ftse100/tsx60/asx200/nikkei225/dax40 (international index Wikipedia pages).
      yfinance_suffix is '' for US tickers and '.L'/'.TO'/'.AX'/'.T'/'.DE'
      for international tickers. fundamentals_cohort (0-3) drives the rotating
      weekly fundamentals extraction schedule; NULL for ETFs.
    columns:
      - name: ticker
        tests:
          - not_null
          - unique
      - name: source
        tests:
          - not_null
          - accepted_values:
              values: ['sp500', 'sp400', 'sp600', 'etf', 'manual',
                       'nasdaq_trader',
                       'ftse100', 'tsx60', 'asx200', 'nikkei225', 'dax40']
      - name: is_active
        tests:
          - not_null
      - name: is_equity
        tests:
          - not_null
      - name: country
        description: "ISO-2 country code. US for all domestic tickers."
      - name: yfinance_suffix
        description: "Suffix appended to base symbol for yfinance calls. Empty string for US."
      - name: fundamentals_cohort
        description: "0-3 rotating cohort for weekly fundamentals extraction. NULL for ETFs."

  # ── Price and company data ────────────────────────────────────────────────────

  - name: stg_prices
    description: >
      Cleaned OHLCV price data. Grain: ticker + price_date.
      Deduplicates RAW append-only overlaps via QUALIFY (latest extracted_at wins).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, price_date]
    columns:
      - name: ticker
        tests:
          - not_null
      - name: price_date
        tests:
          - not_null
      - name: close_price
        tests:
          - not_null
      - name: volume
        tests:
          - not_null

  - name: stg_companies
    description: "Cleaned company metadata. Grain: ticker."
    columns:
      - name: ticker
        tests:
          - not_null
          - unique
      - name: sector
        tests:
          - not_null

  - name: stg_financial_statements
    description: >
      Cleaned financial statement data in EAV format.
      Grain: ticker + statement_type + frequency + period_end_date + line_item.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ticker
            - statement_type
            - frequency
            - period_end_date
            - line_item
    columns:
      - name: ticker
        tests:
          - not_null
      - name: statement_type
        tests:
          - not_null
          - accepted_values:
              values: ['income_statement', 'balance_sheet', 'cash_flow']
      - name: frequency
        tests:
          - not_null
          - accepted_values:
              values: ['annual', 'quarterly']
      - name: period_end_date
        tests:
          - not_null
      - name: line_item
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: stg_valuation_metrics
    description: "Cleaned point-in-time valuation ratios. Grain: ticker + snapshot_date."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, snapshot_date]
    columns:
      - name: ticker
        tests:
          - not_null
      - name: snapshot_date
        tests:
          - not_null
      - name: trailing_pe
        description: "Trailing PE ratio. PE > 1000 is almost certainly a data extraction error."
        tests:
          - dbt_utils.expression_is_true:
              expression: "trailing_pe <= 1000 or trailing_pe is null"
              severity: warn
      - name: forward_pe
        description: "Forward PE ratio. PE > 1000 is almost certainly a data extraction error."
        tests:
          - dbt_utils.expression_is_true:
              expression: "forward_pe <= 1000 or forward_pe is null"
              severity: warn
      - name: gross_margin
        description: "Gross margin as decimal. yfinance returns decimals (0.45 = 45%). Values outside [-1, 1] indicate extraction errors."
        tests:
          - dbt_utils.expression_is_true:
              expression: "(gross_margin between -1.0 and 1.0) or gross_margin is null"
              severity: warn
      - name: operating_margin
        description: "Operating margin as decimal. Values outside [-1, 1] indicate extraction errors."
        tests:
          - dbt_utils.expression_is_true:
              expression: "(operating_margin between -1.0 and 1.0) or operating_margin is null"
              severity: warn
      - name: profit_margin
        description: "Net profit margin as decimal. Values outside [-1, 1] indicate extraction errors."
        tests:
          - dbt_utils.expression_is_true:
              expression: "(profit_margin between -1.0 and 1.0) or profit_margin is null"
              severity: warn

  # ── Supplemental equity data ──────────────────────────────────────────────────

  - name: stg_dividends_and_splits
    description: "Corporate actions (dividends + splits). Grain: ticker + action_date."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, action_date]
    columns:
      - name: ticker
        tests:
          - not_null
      - name: action_date
        tests:
          - not_null

  - name: stg_earnings_history
    description: "EPS actuals vs. estimates per fiscal quarter. Grain: ticker + period_date."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, period_date]
    columns:
      - name: ticker
        tests:
          - not_null
      - name: period_date
        tests:
          - not_null

  - name: stg_analyst_recommendations
    description: >
      Analyst consensus counts by period and position.
      Grain: ticker + period + period_index.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, period, period_index]
    columns:
      - name: ticker
        tests:
          - not_null
      - name: period
        tests:
          - not_null
      - name: period_index
        tests:
          - not_null

  - name: stg_analyst_price_targets
    description: "Weekly consensus price target snapshot. Grain: ticker + snapshot_date."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, snapshot_date]
    columns:
      - name: ticker
        tests:
          - not_null
      - name: snapshot_date
        tests:
          - not_null

  # ── FRED macro data ───────────────────────────────────────────────────────────

  - name: stg_macro_indicators
    description: >
      Cleaned FRED macro observations. Grain: series_id + observation_date.
      Deduplicates RAW append-only overlaps via QUALIFY (latest extracted_at wins).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [series_id, observation_date]
    columns:
      - name: series_id
        tests:
          - not_null
      - name: observation_date
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: stg_fred_selection
    description: "Active FRED series selection. Grain: series_id."
    columns:
      - name: series_id
        tests:
          - not_null
          - unique
      - name: is_active
        tests:
          - not_null

  - name: stg_fred_releases
    description: "FRED statistical release metadata. Grain: release_id."
    columns:
      - name: release_id
        tests:
          - not_null
          - unique
      - name: release_name
        tests:
          - not_null

  - name: stg_fred_series_catalog
    description: "Full FRED series universe (~800K rows). Grain: series_id."
    columns:
      - name: series_id
        tests:
          - not_null
          - unique
      - name: title
        tests:
          - not_null
