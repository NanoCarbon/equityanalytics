version: 2

models:

  - name: dim_date
    description: "Calendar dimension spanning 2009 to present. Grain: date_key."
    columns:
      - name: date_key
        tests:
          - not_null
          - unique
      - name: year
        tests:
          - not_null
      - name: is_weekday
        tests:
          - not_null

  - name: dim_security
    description: "One row per unique security with company metadata. Grain: ticker."
    columns:
      - name: ticker
        tests:
          - not_null
          - unique
      - name: sector
        tests:
          - not_null

  - name: fact_daily_prices
    description: >
      Daily price and return metrics per security.
      Grain: ticker + price_date.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, price_date]
    columns:
      - name: ticker
        tests:
          - not_null
      - name: price_date
        tests:
          - not_null
      - name: close_price
        tests:
          - not_null
      - name: daily_return
        tests:
          - not_null
      - name: volume
        tests:
          - not_null

  - name: fact_macro_readings
    description: >
      Macro indicator observations from FRED.
      Grain: series_id + observation_date.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [series_id, observation_date]
    columns:
      - name: series_id
        tests:
          - not_null
      - name: observation_date
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: fact_fundamentals
    description: >
      Pivoted financial statement data.
      Grain: ticker + period_end_date + frequency.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, period_end_date, frequency]
    columns:
      - name: ticker
        tests:
          - not_null
      - name: period_end_date
        tests:
          - not_null
      - name: frequency
        tests:
          - not_null
          - accepted_values:
              values: ['annual', 'quarterly']

  - name: fact_valuation_snapshot
    description: >
      Point-in-time valuation ratios and metrics.
      Grain: ticker + snapshot_date.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, snapshot_date]
    columns:
      - name: ticker
        tests:
          - not_null
      - name: snapshot_date
        tests:
          - not_null
      - name: trailing_pe
        description: "Trailing 12-month price-to-earnings ratio."
      - name: forward_pe
        description: "Forward price-to-earnings ratio based on analyst estimates."
      - name: gross_margin
        description: "Gross margin stored as decimal (0.45 = 45%). Values >1 or <-1 indicate extraction errors."
      - name: operating_margin
        description: "Operating margin stored as decimal."
      - name: profit_margin
        description: "Net profit margin stored as decimal."
