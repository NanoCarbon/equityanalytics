# ─────────────────────────────────────────────────────────────────
# Shared config applied to every Airflow service
# ─────────────────────────────────────────────────────────────────
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  env_file:
    - .env
  environment:
    # Airflow internals
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: '30'
    # Key-pair auth — path inside the container (file mounted below)
    SNOWFLAKE_PRIVATE_KEY_PATH: /opt/airflow/snowflake_private_key.pem
    # Python packages installed at container startup (keeps image small)
    _PIP_ADDITIONAL_REQUIREMENTS: >-
      yfinance pandas requests python-dotenv
      snowflake-connector-python snowflake-connector-python[pandas]
      cryptography
  volumes:
    - ./airflow/dags:/opt/airflow/dags          # DAGs live here
    - ./airflow/logs:/opt/airflow/logs          # Scheduler + task logs
    - ./airflow/plugins:/opt/airflow/plugins    # Custom operators (future)
    - ./ingestion:/opt/airflow/ingestion        # Reuse existing extract/load code
    - ./snowflake_private_key.pem:/opt/airflow/snowflake_private_key.pem:ro  # Snowflake auth
  depends_on:
    airflow-db:
      condition: service_healthy

# ─────────────────────────────────────────────────────────────────
# Services
# ─────────────────────────────────────────────────────────────────
services:

  # Airflow metadata database (local — separate from Neon data warehouse)
  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # One-shot init: run db migrations + create admin user
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}"
        echo "Airflow initialized."
    restart: "no"

  # Web UI — http://localhost:8080  (admin / admin)
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Scheduler — picks up DAGs and triggers task runs
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

# ─────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────
volumes:
  airflow-db-data:
